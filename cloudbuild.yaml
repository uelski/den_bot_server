# Cloud Build pipeline — triggered on push to main.
# Steps: build container -> push to Artifact Registry -> deploy to Cloud Run.
#
# Redis (LangGraph checkpointer) runs on Redis Cloud (Redis 8).
# langgraph-checkpoint-redis requires RedisJSON + RediSearch modules. Redis 8
# bundles both into core and exposes a public TLS endpoint, so no VPC connector
# is needed. See deployment.md Phase C for why Memorystore and Upstash failed.
#
# Resolved variables:
#   $PROJECT_ID    = blue-cypher              (Cloud Build built-in)
#   $COMMIT_SHA    = git commit SHA           (Cloud Build built-in)
#   $_REGION       = us-east4                 (user-substitution, defaulted below)
#   $_REPO         = den-bot                  (Artifact Registry repo)
#   $_IMAGE        = den-bot-server           (image name)
#   $_SERVICE      = den-bot-server           (Cloud Run service)

substitutions:
  _REGION: us-east4
  _REPO: den-bot
  _IMAGE: den-bot-server
  _SERVICE: den-bot-server

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:${COMMIT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:${COMMIT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --timeout=600s
      - --memory=1Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=10
      - --concurrency=40
      # Service was originally deployed with a VPC connector for Memorystore.
      # We've since moved to Redis Cloud (public TLS, no VPC). Clearing the
      # reference here is idempotent and prevents new revisions from failing
      # validation against the now-deleted connector. (Egress setting becomes
      # inert without a connector — there's no --clear-vpc-egress flag.)
      - --clear-vpc-connector
      # Custom delimiter (^##^) lets ALLOWED_ORIGINS contain commas.
      # See: https://cloud.google.com/sdk/gcloud/reference/topic/escaping
      # GCS_UPLOAD_BUCKET is a bucket name (not a secret) — it gates the
      # /admin/pdf-upload-url endpoint. ADMIN_PASSWORD lives in Secret Manager
      # (it's the shared admin secret). Both unset → /admin/* returns 503.
      # See deployment-pdf-kb.md Track A.
      - --set-env-vars=^##^QDRANT_COLLECTION_NAME=denver_gis_catalog##GEMINI_MODEL=gemini-2.5-flash##LANGCHAIN_TRACING_V2=true##LANGCHAIN_PROJECT=blue-cypher-prod##ALLOWED_ORIGINS=https://bluecypher.ai,https://www.bluecypher.ai##MEMORY_HISTORY_TURNS=8##MEMORY_TTL_MINUTES=43200##RTD_REALTIME_CACHE_TTL_SECONDS=30##TAVILY_CACHE_TTL_SECONDS=86400##RTD_USER_AGENT=blue-cypher-denver-rag (sam.vburgh@gmail.com)##GCS_UPLOAD_BUCKET=den-bot-pdf-uploads##RERANK_SCORE_THRESHOLD=0.3
      - --set-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest,QDRANT_URL=QDRANT_URL:latest,QDRANT_API_KEY=QDRANT_API_KEY:latest,REDIS_URL=REDIS_URL:latest,RESEND_API_KEY=RESEND_API_KEY:latest,FEEDBACK_TO_EMAIL=FEEDBACK_TO_EMAIL:latest,FEEDBACK_FROM_EMAIL=FEEDBACK_FROM_EMAIL:latest,LANGCHAIN_API_KEY=LANGCHAIN_API_KEY:latest,TAVILY_API_KEY=TAVILY_API_KEY:latest,ADMIN_PASSWORD=ADMIN_PASSWORD:latest,COHERE_API_KEY=COHERE_API_KEY:latest

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:${COMMIT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:latest

options:
  # Required when Cloud Build runs as a non-default SA OR when default-SA
  # behavior in your project lacks the legacy bucket. Harmless either way.
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
